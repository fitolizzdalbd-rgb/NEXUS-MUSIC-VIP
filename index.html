
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="description" content="NEXUS MUSIC VIP - Acede à tua conta VIP.">
  <title>NEXUS MUSIC VIP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-icon {
      color: #f0142f;
      font-size: 48px;
    }

    .logo h1 {
      font-size: 29px;
      letter-spacing: 3px;
    }

    .logo p {
      color: #92929b;
      font-size: 13px;
      margin-top: 9px;
    }

    .panel {
      background: #15151c;
      border: 1px solid #292933;
      border-radius: 17px;
      padding: 25px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 16px;
      background: #0d0d12;
      border: 1px solid #353540;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #f0142f;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #e50925;
      color: white;
      font-weight: bold;
      font-size: 15px;
      margin-top: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      color: #ff7373;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    .ad-area {
      width: 100%;
      min-height: 100px;
      margin: 25px 0;
      text-align: center;
      overflow: hidden;
    }

    .footer {
      text-align: center;
      color: #777782;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="logo">
      <div class="logo-icon">♫</div>
      <h1>NEXUS MUSIC</h1>
      <p>O teu acesso VIP começa aqui.</p>
    </header>

    <section class="panel">
      <form id="accessForm">

        <label for="whatsappId">ID DO WHATSAPP</label>

        <input
          id="whatsappId"
          type="text"
          placeholder="Coloca o teu ID aqui"
          autocomplete="off"
          inputmode="numeric"
          maxlength="20"
          required
        >

        <button id="accessButton" type="submit">
          ACESSAR
        </button>

        <p class="message" id="message" aria-live="polite"></p>

      </form>
    </section>

    <!-- ANÚNCIO ADSTERRA -->
    <div class="ad-area">
      <script async="async" data-cfasync="false"
        src="https://bauval.org/21/22fbee67b7db5c60edb54037fe2af0cb"></script>

      <div id="container-22fbee67b7db5c60edb54037fe2af0cb"></div>
    </div>
    <!-- FIM DO ANÚNCIO -->

    <footer class="footer">
      NEXUS MUSIC © 2026 — TODOS OS DIREITOS RESERVADOS
    </footer>

  </main>

  <script>
    (function () {
      const form = document.getElementById('accessForm');
      const input = document.getElementById('whatsappId');
      const message = document.getElementById('message');
      const button = document.getElementById('accessButton');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const id = input.value.trim();

        if (!/^[0-9]{6,20}$/.test(id)) {
          message.textContent =
            'Introduz um ID válido, com 6 a 20 números.';
          return;
        }

        try {
          localStorage.setItem('nexus_user_id', id);
        } catch (error) {
          message.textContent =
            'Não foi possível guardar o teu ID. Verifica as definições do navegador.';
          return;
        }

        button.disabled = true;
        button.textContent = 'A ENTRAR...';
        message.textContent = '';

        window.location.href = '/painel.html';
      });
    })();
  </script>

</body>
</html>

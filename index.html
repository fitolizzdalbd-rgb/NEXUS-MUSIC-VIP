
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>NEXUS MUSIC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 35px; }
    .logo-icon { color: #f0142f; font-size: 48px; }
    .logo h1 { font-size: 29px; letter-spacing: 3px; }
    .logo p { color: #92929b; font-size: 13px; margin-top: 9px; }
    .panel {
      background: #15151c;
      border: 1px solid #292933;
      border-radius: 17px;
      padding: 25px;
    }
    label { display: block; font-size: 13px; margin-bottom: 10px; }
    input {
      width: 100%;
      padding: 16px;
      background: #0d0d12;
      border: 1px solid #353540;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #f0142f; }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #e50925;
      color: white;
      font-weight: bold;
      font-size: 15px;
      margin-top: 17px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .message {
      margin-top: 15px;
      color: #ff7373;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
    .footer {
      text-align: center;
      color: #777782;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="logo">
      <div class="logo-icon">♫</div>
      <h1>NEXUS MUSIC</h1>
      <p>O teu acesso VIP começa aqui.</p>
    </header>

    <section class="panel">
      <form id="accessForm">
        <label for="whatsappId">ID DO WHATSAPP</label>
        <input
          id="whatsappId"
          type="text"
          placeholder="Coloca o teu ID aqui"
          autocomplete="off"
          required
        >
        <button id="accessButton" type="submit">ACESSAR</button>
        <p class="message" id="message"></p>
      </form>
    </section>

    <footer class="footer">
      NEXUS MUSIC © 2026 — TODOS OS DIREITOS RESERVADOS
    </footer>
  </main>

  <script>
  document.getElementById('accessForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const id = document.getElementById('whatsappId').value.trim();
    const message = document.getElementById('message');
    const button = document.getElementById('accessButton');

    if (!/^[0-9]+$/.test(id)) {
      message.textContent = 'Introduz um ID válido.';
      return;
    }

    localStorage.setItem('nexus_user_id', id);

    button.disabled = true;
    button.textContent = 'A ENTRAR...';

    window.location.href = '/painel.html';
  });
</script>
</body>
</html>
